services:
  endpoint:
    build:
      context: ../../
      dockerfile: supervictor/endpoint/Dockerfile
    expose:
      - "8000"
    environment:
      STORE_BACKEND: sqlite
      SQLITE_DB_PATH: /data/supervictor.db
      LOG_LEVEL: info
    volumes:
      - /var/lib/supervictor:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - /opt/supervictor/app/supervictor/endpoint/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - /opt/supervictor/certs/ca.pem:/etc/caddy/certs/ca.pem:ro
      - /opt/supervictor/certs/server.pem:/etc/caddy/certs/server.pem:ro
      - /opt/supervictor/certs/server.key:/etc/caddy/certs/server.key:ro
    depends_on:
      endpoint:
        condition: service_healthy
    restart: unless-stopped
