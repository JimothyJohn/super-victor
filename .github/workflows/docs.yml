name: Deploy Rust Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Build docs (common)
        run: cargo doc -p supervictor-common --features alloc --no-deps

      - name: Build docs (endpoint)
        run: cargo doc -p supervictor-endpoint --features sqlite --no-deps --target x86_64-unknown-linux-gnu

      - name: Render dashboard demo (static, seeded)
        run: |
          mkdir -p site
          cargo run -p supervictor-endpoint --example render_demo -- site/demo

      - name: Assemble site (landing page + demo + rustdoc under /api)
        run: |
          cp -r docs/* site/
          mkdir -p site/api
          cp -r target/doc/* site/api/ 2>/dev/null || true
          cp -r target/x86_64-unknown-linux-gnu/doc/* site/api/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0;url=supervictor_endpoint/index.html">' \
            > site/api/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
