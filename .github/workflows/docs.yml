name: Deploy Rust Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Build docs (common)
        run: cargo doc -p supervictor-common --features alloc --no-deps

      - name: Build docs (endpoint)
        run: cargo doc -p supervictor-endpoint --features sqlite --no-deps --target x86_64-unknown-linux-gnu

      - name: Render dashboard demo (static, seeded)
        run: |
          mkdir -p site
          cargo run -p supervictor-endpoint --example render_demo -- site/demo

      - name: Assemble site (landing page + demo + rustdoc under /api)
        run: |
          cp -r docs/* site/
          mkdir -p site/api
          cp -r target/doc/* site/api/ 2>/dev/null || true
          cp -r target/x86_64-unknown-linux-gnu/doc/* site/api/ 2>/dev/null || true
          echo '<meta http-equiv="refresh" content="0;url=supervictor_endpoint/index.html">' \
            > site/api/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
