name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Lint + test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check edge desktop feature
        run: cargo check -p supervictor-edge --features desktop

  embedded:
    name: Embedded build (riscv32, ESP32-C3)
    runs-on: ubuntu-latest
    env:
      # Compile-time config baked into the firmware; CI uses the committed
      # test-device certs and dummy WiFi/host values — compile check only.
      CERT_PATH: certs/
      CA_PATH: ca/AmazonRootCA1.pem
      DEVICE_NAME: test-device
      HOST: ci.invalid
      SSID: ci-ssid
      PASSWORD: ci-password
      TLS_VERSION: "1.3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - name: Check embedded firmware
        working-directory: supervictor/edge
        run: cargo check --features embedded --locked
