name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Endpoint server for the t4g.micro staging host (and any arm64 Linux box).
  build-endpoint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152669aa8203 # stable
        with:
          toolchain: stable

      - name: Build endpoint
        run: cargo build -p supervictor-endpoint --release --features sqlite,dynamo

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/supervictor-endpoint dist/supervictor-endpoint
          cd dist
          tar czf supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz supervictor-endpoint
          shasum -a 256 supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz \
            > supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supervictor-endpoint-aarch64-unknown-linux-gnu
          path: dist/supervictor-endpoint-*.tar.gz*

  release:
    needs: [build-endpoint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            supervictor-endpoint-*.tar.gz
            supervictor-endpoint-*.sha256
          generate_release_notes: true
