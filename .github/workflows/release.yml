name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Endpoint server for the t4g.micro staging host (and any arm64 Linux box).
  build-endpoint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Build endpoint
        run: cargo build -p supervictor-endpoint --release --features sqlite,dynamo

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/supervictor-endpoint dist/supervictor-endpoint
          cd dist
          tar czf supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz supervictor-endpoint
          shasum -a 256 supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz \
            > supervictor-endpoint-aarch64-unknown-linux-gnu.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supervictor-endpoint-aarch64-unknown-linux-gnu
          path: dist/supervictor-endpoint-*.tar.gz*

  release:
    needs: [build-endpoint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            supervictor-endpoint-*.tar.gz
            supervictor-endpoint-*.sha256
          generate_release_notes: true
