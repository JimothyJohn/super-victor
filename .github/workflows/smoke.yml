name: Post-deploy smoke

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "Base URL of the deployed endpoint (e.g. https://staging.supervictor.advin.io)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Health smoke against deployed endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - name: Quickstart integration (staging smoke)
        run: STAGING_URL="${{ inputs.staging_url }}" ./Quickstart integration
